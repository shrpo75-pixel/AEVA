version: '3.9'

services:
  aeva-os:
    build: .
    container_name: aeva-os
    ports:
      - "8501:8501"
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      AEVA_DEBUG: ${AEVA_DEBUG:-false}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
  logs:
